<!DOCTYPE html>
<!-- Объявление типа документа -->
<!-- HTML-документа, все содержимое элементов -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- это стандартная кодировка, которая поддерживает большинство языков и символов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- определение  заголовок веб странице и отображает на вкладке браузера -->

    <title>Document</title>
    <style>
        h1 {
            text-align: center;
            color: red;
        }

        /* h1,h2 это теги заголовков записываем название, авторов  */
        h2 {
            text-align: center;
            color: red;
        }

        /* в стайле мы можем изменить цвет шрифта и текст */
        .title {
            color: green;
        }

        #priority {
            color: purple;
        }

        p {
            text-align: center;
            color: blue;
        }

        div {
            background-color: lightgray;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="title">Зима</h1>
        <h2 class="title" id="priority">Сергей Есенин</h2>
        <p сlass="text"> Вот уж осень улетела<br>
            И примчалася зима.<br>
            Как на крыльях, прилетела<br>
            Невидимо вдруг она.</p><br>
    </div>

    <ul>
        <!-- ul  используются для перечисления элементов  -->
        <li id="1">первая строка</li>
        <li id="2">вторая строка</li> <!-- <li> представляет элемент списка -->

        <li id="3">третья строка</li>
        <li id="4">четвертая строка</li>
    </ul>
    <h1 class="title">Стихотворение</h1>
    <h2 class="author">Другой автор</h2>
</body>

</html>
