<!DOCTYPE html><!-- В HTML элементы блочные и строчные каждый тип элемента имеет свои особенности в отношении отображения и поведения на веб-странице.
 -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 100%;
            height: 80vh;
            background-image: url("./картина/image.jpg");
        }

        h1 {
            color: rgba(44, 40, 37, 0.29);
            background-color: rgba(110, 179, 130, 0.426);
        }

        .inline-to-block {
            display: block;
        }

        /* С помощью CSS можно изменять тип отображения элементов, используя свойство display. */
        .block-to-inline {
            display: inline;
        }
    </style>
</head>

<body>
    <h1>Репка</h1>
    <p>Репка — русская народная сказка</p>
    <div class="container">
        <div class="block">Это блочный элемент </div><!-- всегда начинают с новой строки и занимают 
        всю доступную ширину. Они могут содержать как другие блочные элементы, так и строчные элементы. -->
        <h1 class="blok">Это блочный элемент (h1)</h1>
        <p class="block">Это блочный элемент (p)</p>
        <a href="#" class="inline">Это строчный элемент (a)</a><!--  располагаются в строку, занимая только необходимую для их содержимого ширину. Они могут содержать только другие строчные элементы или текст.
 -->
        <a href="#" class="inline">русская народная сказка(a)</a>

    </div>
</body>

</html>
