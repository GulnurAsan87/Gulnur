<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 80%;
            /* это проценты родительского элемента. */
            height: 50vh;
            /* vh  1vh равен 1% высоты окна просмотра. */
            background-color: rgb(211, 211, 211);/* устанавливает цвет фона элемента. */
            background-image: url("./картина/image.avif");/* фоновое изображение для элемента. */

        }

        div {
            padding: 15;/* задает внутренние отступы элемента. */
            margin: 20px;/*  внешние отступы элемента. */
            border: 1px solid rgb(0, 255, 8)
        }

        .text-em {
            font-size: 2em;
            /* это размера шрифта родительского элемента. */
        }

        p {
            color: #3374ffcc;
            /* */
        }

        /* Цвет задается с помощью шестнадцатеричного кода, состоящего из 6 символов.
         Каждая пара символов обозначает интенсивность красного, зеленого и синего цветов (RGB).
 */

        p {
            color: rgb(71, 51, 255);
            /* Красный цвет */
        }

        /* Цвет задается с помощью функции rgb(), которая принимает три значения от 0 до 255, 
        обозначающих интенсивность красного, зеленого и синего цветов. */
        p {
            color: rgba(88, 51, 255, 0.5);
            /* Полупрозрачный красный цвет */
        }

        /* RGBA является расширением модели RGB, добавляющим четвертое значение - альфа-канал (прозрачность). 
Альфа-канал принимает значения от 0 (полностью прозрачно) до 1 (полностью непрозрачно). */


        h1 {
            font-size: 1.5rem;
        }
        /* устанавливает размер шрифта. */
    </style>
</head>

<body>
    <h1>Hello</h1>
    <h2>world</h2>
    <p></p>
    <p class="font-size1">Hello world</p>
    <p class="font-size2">people</p>
    <div class="container">
        <p class="text-em">Hello</p>
        <p class="text-rem">world</p>
        <div>blok</div>
        <div>blok</div>



    </div>



</body>

</html>
